name: Demo Container

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image
        run: >-
          dotnet publish BlazorScheduler.Demo/BlazorScheduler.Demo.csproj -c Release /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/blazorscheduler-demo
          -p:ContainerImageTag=${{ github.sha }}
      - name: Publish latest image
        if: github.ref == 'refs/heads/main'
        run: >-
          dotnet publish BlazorScheduler.Demo/BlazorScheduler.Demo.csproj -c Release /t:PublishContainer --no-restore
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/blazorscheduler-demo
          -p:ContainerImageTag=latest


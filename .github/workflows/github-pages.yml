name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish WebAssembly app
        run: dotnet publish BlazorScheduler.Demo.Client/BlazorScheduler.Demo.Client.csproj -c Release -o release
      - name: Rewrite base href for GitHub Pages
        run: sed -i 's#<base href="/" />#<base href="/BlazorScheduler/" />#' release/wwwroot/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/js/scheduler.test.js
      - run: dotnet restore BlazorScheduler.sln
      - run: dotnet build BlazorScheduler.sln -c Release --no-restore
      - run: dotnet test BlazorScheduler.Tests/BlazorScheduler.Tests.csproj -c Release --no-build
      - run: dotnet pack BlazorScheduler/BlazorScheduler.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
